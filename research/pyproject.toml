[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soundcore-audio-lab"
version = "0.1.0"
description = "Experimental source-clock solo vocal transcription core"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "onnxruntime>=1.18", "onnx>=1.16", "mido>=1.3"]

[tool.setuptools.packages.find]
include = ["soundcore_audio*"]
